<!DOCTYPE html>

<style>
  :root{
    --bg:#141210; --bg2:#1c1916; --panel:#211d19; --line:#3a332c;
    --ink:#efe9df; --ink-dim:#a89f92; --ink-dimmer:#726a5f;
    --gold:#c99a3f; --gold-soft:#8a6b30;
    --ok:#5f8c5a; --warn:#c78a3a; --bad:#a5473a; --info:#4d7a91;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4f1ea; --bg2:#ece7dc; --panel:#fffdf9; --line:#ddd5c4;
      --ink:#211d19; --ink-dim:#5c554a; --ink-dimmer:#8a8072;
      --gold:#96712a; --gold-soft:#c99a3f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141210; --bg2:#1c1916; --panel:#211d19; --line:#3a332c;
    --ink:#efe9df; --ink-dim:#a89f92; --ink-dimmer:#726a5f;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    display:flex; overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  /* ---- Sidebar ---- */
  #sidebar{
    width:270px; min-width:270px; background:var(--bg2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; height:100%;
  }
  #brand{
    padding:22px 20px 18px; border-bottom:1px solid var(--line); position:relative; overflow:hidden;
  }
  #brand::before{
    content:''; position:absolute; inset:0; opacity:.5; pointer-events:none;

      repeating-linear-gradient(115deg, transparent 0 18px, rgba(201,154,63,0.05) 18px 19px),
      repeating-linear-gradient(115deg, transparent 0 30px, rgba(201,154,63,0.04) 30px 31px);
  }
  #brand .mark{font-family:"Georgia",serif; font-size:26px; letter-spacing:0.5px; color:var(--gold); position:relative}

  #navwrap{overflow-y:auto; flex:1; padding:10px 0 20px}
  .navgroup{margin-top:14px}
  .navgroup h4{
    font-family:-apple-system,Segoe UI,sans-serif; font-size:10.5px; font-weight:600;
    color:var(--ink-dimmer); padding:4px 20px; margin:0 0 2px; letter-spacing:.4px;
  }
  .navitem{
    display:flex; align-items:center; gap:10px; padding:7px 20px; cursor:pointer;
    font-family:-apple-system,Segoe UI,sans-serif; font-size:13.5px; color:var(--ink-dim);
    border-left:2px solid transparent;
  }
  .navitem:hover{background:rgba(201,154,63,0.07); color:var(--ink)}
  .navitem.active{background:rgba(201,154,63,0.13); color:var(--gold); border-left-color:var(--gold)}
  .navitem .ic{width:16px; text-align:center; opacity:.85; font-size:13px}

  /* ---- Main ---- */
  #main{flex:1; height:100%; overflow-y:auto; padding:26px 34px 60px}

  .tag.info{background:rgba(77,122,145,.18); color:var(--info)}

  .desc{font-size:15px; line-height:1.65; color:var(--ink-dim); max-width:640px; margin-bottom:22px}

  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); font-family:-apple-system,Segoe UI,sans-serif; font-size:13px}
  th{text-align:left; padding:10px 14px; color:var(--ink-dimmer); font-weight:600; font-size:11px; border-bottom:1px solid var(--line); letter-spacing:.2px}

  .tablewrap{overflow-x:auto; border:1px solid var(--line)}

  #searchbox{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink); padding:8px 12px; margin:0 20px 4px; width:calc(100% - 40px); font-family:-apple-system,Segoe UI,sans-serif; font-size:12.5px}
  #searchbox::placeholder{color:var(--ink-dimmer)}

  .homegrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px}
  .homecard{background:var(--panel); border:1px solid var(--line); padding:16px 18px; cursor:pointer}
  .homecard:hover{border-color:var(--gold-soft)}
  .homecard h3{margin:0 0 4px; font-size:15px; font-weight:500; color:var(--ink)}
  .homecard p{margin:0; font-family:-apple-system,Segoe UI,sans-serif; font-size:12px; color:var(--ink-dimmer)}
  .homecard .n{font-family:-apple-system,Segoe UI,sans-serif; font-size:10.5px; color:var(--gold); letter-spacing:.3px}

  .chartgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin-bottom:24px}
  .chartbox{background:var(--panel); border:1px solid var(--line); padding:16px 18px}
  .chartbox h4{margin:0 0 10px; font-size:13px; font-weight:600; color:var(--ink-dim); font-family:-apple-system,Segoe UI,sans-serif}
  .chart-canvas-wrap{width:100%}
  .btn-secondary{background:transparent; color:var(--gold); border:1px solid var(--gold-soft); padding:11px 22px; font-family:-apple-system,Segoe UI,sans-serif; font-size:13.5px; font-weight:600; cursor:pointer}
  .btn-secondary:hover{background:rgba(201,154,63,0.1)}
  .calcgrid{display:grid; grid-template-columns:1fr 1fr; gap:22px; max-width:720px}

  .calcresult{background:var(--panel); border:1px solid var(--line); padding:18px 20px}
  .calcresult .row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-family:-apple-system,Segoe UI,sans-serif; font-size:13px}
  .calcresult .row:last-child{border-bottom:none}
  .calcresult .row b{color:var(--gold); font-size:15px}
  #csvimport{font-family:-apple-system,Segoe UI,sans-serif; font-size:12px; color:var(--ink-dim); margin-bottom:16px; display:block}

  .editorlist{display:flex; flex-direction:column; gap:2px}
  .editorcat{margin-top:18px; margin-bottom:6px; font-family:-apple-system,Segoe UI,sans-serif; font-size:11px; color:var(--gold); letter-spacing:.3px; text-transform:uppercase}
  .editorrow{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:12px; align-items:center; padding:8px 14px; background:var(--panel); border:1px solid var(--line); border-top:none; font-family:-apple-system,Segoe UI,sans-serif; font-size:12.5px}
  .editorrow:first-of-type,.editorgroup .editorrow:nth-child(1){border-top:1px solid var(--line)}
  .editorrow .mtitle{color:var(--ink)}
  .editorrow .klabel{color:var(--ink-dimmer); font-size:11.5px}
  .editorrow input{background:var(--bg); border:1px solid var(--line); color:var(--ink); padding:6px 9px; font-size:12.5px; width:100%; font-family:-apple-system,Segoe UI,sans-serif}
  .editorrow input:focus{outline:1px solid var(--gold); border-color:var(--gold)}
  #savenote{font-family:-apple-system,Segoe UI,sans-serif; font-size:11.5px; color:var(--ok); height:16px; margin:10px 0 0}

  .replist{display:flex; flex-direction:column; gap:10px; margin-bottom:20px}
  .repcat h4{font-family:-apple-system,Segoe UI,sans-serif; font-size:11px; color:var(--ink-dimmer); letter-spacing:.3px; margin:14px 0 6px}
  .repitem{display:flex; align-items:center; gap:9px; padding:5px 0; font-family:-apple-system,Segoe UI,sans-serif; font-size:13px; color:var(--ink-dim)}
  .repitem input{accent-color:var(--gold)}
  #genpdfbtn{
    background:var(--gold); color:#1c1410; border:none; padding:11px 22px; font-family:-apple-system,Segoe UI,sans-serif;
    font-size:13.5px; font-weight:600; cursor:pointer; letter-spacing:.2px;
  }
  #genpdfbtn:hover{background:var(--gold-soft)}
  .repactions{display:flex; align-items:center; gap:14px; margin-top:6px; position:sticky; bottom:0; background:var(--bg); padding:14px 0}
  .repcount{font-family:-apple-system,Segoe UI,sans-serif; font-size:12px; color:var(--ink-dimmer)}
  .rep-toggle-all{font-family:-apple-system,Segoe UI,sans-serif; font-size:11.5px; color:var(--gold); cursor:pointer; text-decoration:underline; margin-left:12px}

  .dm-ribbon{display:flex; border:1px solid var(--line); border-bottom:none; background:var(--bg2)}
  .dm-tab{padding:9px 16px; font-family:-apple-system,Segoe UI,sans-serif; font-size:12px; color:var(--ink-dim); border-right:1px solid var(--line); cursor:default}
  .dm-tab.active{color:var(--gold); background:var(--panel); border-bottom:2px solid var(--gold)}
  .dm-workspace{display:grid; grid-template-columns:190px 1fr 190px; border:1px solid var(--line); min-height:300px}
  .dm-side{background:var(--panel); border-right:1px solid var(--line); padding:10px 0; overflow-y:auto}
  .dm-side:last-child{border-right:none; border-left:1px solid var(--line)}
  .dm-panel-title{font-family:-apple-system,Segoe UI,sans-serif; font-size:10.5px; color:var(--gold); text-transform:uppercase; letter-spacing:.3px; padding:6px 12px; border-bottom:1px solid var(--line); margin-bottom:2px}
  .dm-list{margin-bottom:10px}
  .dm-item{font-family:-apple-system,Segoe UI,sans-serif; font-size:11.5px; color:var(--ink-dim); padding:4px 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dm-item input{margin-right:5px; vertical-align:middle}
  .dm-canvas{position:relative; background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden}
  .dm-canvas-label{position:absolute; bottom:8px; left:12px; font-family:-apple-system,Segoe UI,sans-serif; font-size:10.5px; color:var(--ink-dimmer)}
  .dm-proptable{width:100%; font-family:-apple-system,Segoe UI,sans-serif; font-size:11.5px; border-collapse:collapse}
  .dm-proptable td{padding:5px 12px; color:var(--ink-dim); border-bottom:1px solid var(--line)}
  .dm-proptable td:first-child{color:var(--ink-dimmer)}
  .dm-cmdlog{background:#0d0b09; border:1px solid var(--line); border-top:none; padding:10px 14px; font-family:"SF Mono",Consolas,monospace; font-size:11px; color:#8fae7a; max-height:120px; overflow-y:auto}
  :root:not([data-theme="dark"]) .dm-cmdlog{background:#1c1712; color:#a7c491}

  @media(max-width:820px){
    #sidebar{position:fixed; z-index:20; transform:translateX(-100%); transition:transform .2s}
    #sidebar.open{transform:translateX(0)}
    #main{width:100%}
    #menubtn{display:inline-block !important}
  }
  #menubtn{display:none; background:none; border:1px solid var(--line); color:var(--ink); padding:6px 10px; font-size:14px; cursor:pointer; margin-bottom:10px}
  .note{font-family:-apple-system,Segoe UI,sans-serif;font-size:12px;line-height:1.5;color:var(--ink-dimmer);border-left:2px solid var(--gold-soft);padding:2px 0 2px 10px;margin:-10px 0 20px;max-width:720px}
  .col{display:flex;flex-direction:column;gap:10px;min-width:0}
  .sg{display:grid;grid-template-columns:250px minmax(0,1fr) 260px;gap:10px;margin-bottom:10px}
  .sg2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;margin-bottom:10px}
  .pn{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;font-family:-apple-system,Segoe UI,sans-serif;font-size:12px;color:var(--ink-dim)}
  .pn>h5{margin:0;padding:7px 12px;font-size:12px;font-weight:600;color:var(--gold);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pn .bd{padding:6px 0;overflow:auto;max-height:270px}
  .tr{display:flex;gap:6px;align-items:center;padding:3px 10px;cursor:pointer;white-space:nowrap}
  .tr:hover{background:rgba(201,154,63,.08)} .tr.on{background:rgba(201,154,63,.16);color:var(--gold)}
  .tr i{font-style:normal;color:var(--ink-dimmer);margin-left:auto;font-size:10.5px}
  .lay{display:grid;grid-template-columns:auto auto 24px 1fr;gap:6px;align-items:center;padding:3px 10px}
  .lnm{cursor:pointer} .lnm:hover{color:var(--gold)}
  .ib{background:none;border:1px solid var(--line);color:var(--ink-dim);cursor:pointer;padding:1px 5px;font-size:12px;line-height:1.4}
  .ib.off{opacity:.35}
  .lay input[type=color]{width:24px;height:22px;padding:0;border:1px solid var(--line);background:none}
  .lay input[disabled]{opacity:.3}
  .ptitle{padding:8px 10px 3px;font-size:11px;font-weight:600;color:var(--ink-dimmer)}
  .stp{padding:2px 10px;color:var(--ink-dimmer)} .stp.done{color:var(--ink-dim)} .stp b{display:inline-block;width:14px;color:var(--ok)}
  #v3{flex:1;min-height:470px;position:relative;background:var(--bg)} #v3 canvas{display:block;touch-action:none}
  .lgd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-dimmer)}
  .lgd i{display:inline-block;width:14px;height:9px;margin-left:6px}
  .lgd span:last-child{margin-left:auto}
  .empty{padding:14px;color:var(--ink-dimmer);line-height:1.5}
  .pt{width:100%;border-collapse:collapse;border:none;background:transparent;font-size:11.5px}
  .pt th{padding:5px 10px;font-size:11px;position:sticky;top:0;background:var(--panel)} .pt td{padding:4px 10px;border-bottom:1px solid var(--line)}
  .pt td:first-child{color:var(--ink-dimmer)}
  .pt tr[data-h]{cursor:pointer} .pt tr.on td{background:rgba(201,154,63,.14);color:var(--gold)}
  .chip{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:baseline}
  .bt{background:transparent;color:var(--gold);border:1px solid var(--gold-soft);padding:4px 10px;cursor:pointer;font:600 11.5px -apple-system,Segoe UI,sans-serif}
  .bt:hover,.bt.act{background:rgba(201,154,63,.15)}
  .cm{padding:8px 12px;border-bottom:1px solid var(--line)} .cm b{display:block;color:var(--ink);margin-bottom:4px}
  .ci{display:flex;gap:6px;margin-bottom:6px} .cm label{display:block;font-size:11px;color:var(--ink-dimmer);flex:1;min-width:0}
  .cm input,.dhbar select{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:3px 6px;width:100%;font-size:12px}
  .cm input[type=range]{padding:0;margin:4px 0 6px}
  .dhbar{display:flex;gap:6px;padding:8px 12px;align-items:center;flex-wrap:wrap} .dhbar select{width:auto;margin-left:auto}
  .dhsum{padding:2px 12px 8px;color:var(--ink-dimmer)} .dhtb{max-height:230px;overflow:auto}
  .con{background:#0d0b09;font:11px "SF Mono",Consolas,monospace;color:#8fae7a;padding:10px 12px;max-height:290px;overflow:auto;flex:1;min-height:200px}

  .gt{overflow-x:auto;padding:0 12px} .gr{display:grid;grid-template-columns:210px repeat(12,minmax(38px,1fr));border-bottom:1px solid var(--line);align-items:center;min-width:700px}
  .gr>div{padding:4px 4px;text-align:center} .gr>div:first-child{text-align:left} .gh{color:var(--ink-dimmer);font-weight:600}
  .gn{text-align:left!important} .gb{height:14px;padding:0!important;border-radius:1px}
  .gb.a{background:var(--gold)} .gb.b{background:var(--info)} .gb.c{background:var(--gold-soft)} .gb.d{background:var(--ok)}

  @media(max-width:1180px){.sg,.sg2{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>

<nav id="sidebar">
  <div id="brand">
    <svg viewBox="0 0 40 40" fill="none"><path d="M6 28 L14 12 L20 22 L26 8 L34 28 Z" stroke="#c99a3f" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <div class="mark">AURUM</div>
    <div class="sub">Sistem Manajemen Tambang Emas · 50 Modul</div>

<main id="main">

</main>

<script>
const CATS = [
  ["Ringkasan", ["dashboard"]],
  ["Produksi & Operasional", ["produksi-harian","cadangan-emas","peledakan","pengolahan","logistik-tambang","rencana-tambang"]],
  ["K3 & Keselamatan", ["insiden-k3","apd","inspeksi-alat","pelatihan-k3","audit-keselamatan","tanggap-darurat"]],
  ["Lingkungan", ["kualitas-air","kualitas-udara","reklamasi-lahan","limbah-b3","biodiversitas","monitoring-tailing"]],
  ["SDM", ["data-karyawan","absensi","payroll","pelatihan-sdm","kontrak-kerja"]],
  ["Keuangan", ["cashflow","biaya-operasional","royalti-pajak","anggaran","laporan-keuangan"]],
  ["Aset & Peralatan", ["alat-berat","maintenance","inventaris","bahan-bakar","spare-part"]],
  ["Geologi & Eksplorasi", ["data-bor","model-cadangan","peta-geologi","sampling"]],
  ["Pemodelan & Desain Tambang", ["pemodelan-geologi","estimasi-sumberdaya","desain-tambang","optimasi-penjadwalan","studio-desain"]],
  ["Komunitas & CSR", ["program-csr","hubungan-masyarakat","keluhan-warga"]],
  ["Manajemen & Pelaporan", ["laporan-pemerintah"]],
  ["Alat & Laporan", ["editor-data","buat-laporan","kalkulator"]]
];

const MOD = {
  "dashboard":{t:"Ringkasan Eksekutif",d:"Ikhtisar seluruh operasi tambang: produksi, kepatuhan izin, keselamatan, dan keuangan dalam satu pandangan.",kpi:[["Produksi Bulan Ini","1.240 oz","ok","+6% dari bulan lalu"],["Status Izin Aktif","18/20","warn","2 izin mendekati jatuh tempo"],["Hari Tanpa Insiden K3","47 hari","ok","Target: 90 hari"],["Cashflow Operasional","Rp 42,3 M","info","Bulan berjalan"]],
    charts:[
      {type:"line",title:"Tren Produksi Emas (oz) — 6 Bulan Terakhir",labels:["Apr","Mei","Jun","Jul","Agu","Sep"],data:[[1050,1080,1120,1150,1190,1240]],names:["Produksi (oz)"]},

function buildNav(filter){
  const wrap = document.getElementById('navwrap');
  wrap.innerHTML = '';
  CATS.forEach(([cat, ids])=>{
    const shown = ids.filter(id => !filter || MOD[id].t.toLowerCase().includes(filter) || id.includes(filter));
    if(!shown.length) return;
    const g = document.createElement('div'); g.className='navgroup';
    const h = document.createElement('h4'); h.textContent = cat; g.appendChild(h);
    shown.forEach(id=>{
      const item = document.createElement('div');
      item.className = 'navitem' + (id===current ? ' active' : '');
      item.innerHTML = `<span class="ic">${ICONS[cat]||'·'}</span><span>${MOD[id].t}</span>`;
      item.onclick = ()=>render(id);
      g.appendChild(item);
    });
    wrap.appendChild(g);
  });
}

function loadOverrides(){
  try{
    const saved = JSON.parse(localStorage.getItem('aurum-kpi-overrides-v2')||'{}');
    Object.keys(saved).forEach(id=>{ if(MOD[id]) MOD[id].kpi = saved[id]; });
  }catch(e){}

function saveOverrides(){
  try{
    const out = {};
    Object.keys(MOD).forEach(id=>{ if(MOD[id].kpi && MOD[id].kpi.length) out[id]=MOD[id].kpi; });
    localStorage.setItem('aurum-kpi-overrides-v2', JSON.stringify(out));

}

function destroyCharts(){ chartInstances.forEach(ch=>{try{ch.destroy()}catch(e){}}); chartInstances=[]; }

function drawCharts(list,pre){
  pre=pre||'chart-';
  if(!list||!window.ApexCharts) return;
  const cs=getComputedStyle(document.documentElement), ink=cs.getPropertyValue('--ink-dim').trim()||'#8a8072', ln=cs.getPropertyValue('--line').trim()||'#3a332c';
  const isDark=(matchMedia('(prefers-color-scheme: dark)').matches && !document.documentElement.hasAttribute('data-theme'))||document.documentElement.getAttribute('data-theme')==='dark';
  list.forEach((cfg,i)=>{
    const el=document.getElementById(pre+i); if(!el) return;
    const dn=cfg.type==='doughnut', mx=!!cfg.types, ns=cfg.names||[];
    const fmt=v=>v==null?'–':Number(v).toLocaleString('id-ID',{maximumFractionDigits:2})+(cfg.unit||'');
    const o={chart:{type:dn?'donut':(mx?'line':cfg.type),height:cfg.h||250,stacked:!!cfg.stacked,background:'transparent',toolbar:{show:false},fontFamily:'inherit',foreColor:ink},
      colors:cfg.colors||GOLD_PALETTE,theme:{mode:isDark?'dark':'light'},grid:{borderColor:ln,strokeDashArray:3},
      legend:{show:dn||ns.length>1,position:'bottom',fontSize:'11px'},tooltip:{theme:isDark?'dark':'light',y:{formatter:fmt}}};
    if(dn){
      o.series=cfg.data[0]; o.labels=cfg.labels; o.stroke={width:1,colors:[cs.getPropertyValue('--panel').trim()||'#211d19']};
      o.dataLabels={enabled:true,style:{fontSize:'10.5px'}};
      o.plotOptions={pie:{donut:{size:'62%',labels:{show:true,value:{formatter:v=>fmt(+v)},total:{show:true,label:cfg.total||'Total',formatter:w=>fmt(w.globals.seriesTotals.reduce((a,b)=>a+b,0))}}}}};
    } else {
      const tp=j=>mx?cfg.types[j]:cfg.type;
      o.series=cfg.data.map((d,j)=>({name:ns[j],type:mx?cfg.types[j]:undefined,data:d}));
      o.xaxis={categories:cfg.labels,axisBorder:{color:ln},axisTicks:{color:ln}};
      o.stroke={curve:'smooth',width:ns.map((_,j)=>tp(j)==='bar'?0:2.5),dashArray:cfg.dash||0};
      o.markers={size:ns.map((_,j)=>tp(j)==='line'?3:0)};
      o.dataLabels={enabled:false};
      o.plotOptions={bar:{columnWidth:'55%',borderRadius:2,horizontal:!!cfg.horizontal}};
      const lf=v=>Number(v).toLocaleString('id-ID',{maximumFractionDigits:1});
      if(cfg.axes){
        o.yaxis=cfg.axes.map((a,j)=>{const first=cfg.axes.indexOf(a)===j;return {seriesName:ns[cfg.axes.indexOf(a)],show:first,opposite:a===1,title:{text:(cfg.yt||[])[a]},labels:{formatter:lf},min:a===0?cfg.min:undefined}});
        o.tooltip.y={formatter:v=>v==null?'–':lf(v)};
      } else o.yaxis={title:{text:cfg.yt},labels:{formatter:lf},min:cfg.min,max:cfg.max};
    }
    const ch=new ApexCharts(el,o); ch.render(); chartInstances.push(ch);

function renderKalkulator(){

const gv=id=>parseFloat(document.getElementById(id).value);
function cmd(c){
  if(c==='pit'){const h=gv('c-h'),a=gv('c-a'),b=gv('c-b');if(!(h>=5&&h<=20&&a>=45&&a<=80&&b>=3&&b<=15)){LOG('ERROR DESIGN PIT: bench 5–20 m, sudut muka 45–80°, berm 3–15 m','err');return}
    Object.assign(ST.pit,{h,ang:a,berm:b});rebuild('pit');rebuild('road');rebuild('topo');const G=pitGeo();LOG(`DESIGN PIT bench=${h}m face=${a}° berm=${b}m ... sudut keseluruhan ${nf(G.overall)}°, kedalaman ${G.depth} m, radius crest ${nf(G.top,0)} m`,G.overall>50?'warn':'ok');if(G.overall>50)LOG('PERINGATAN: sudut lereng keseluruhan > 50°, perlu kajian geoteknik','warn')}
  if(c==='road'){const g=gv('c-g'),w=gv('c-w');if(!(g>=4&&g<=14&&w>=15&&w<=45)){LOG('ERROR HAULROAD: gradien 4–14%, lebar 15–45 m','err');return}
    Object.assign(ST.road,{gr:g,w});rebuild('road');LOG(`HAULROAD gradien=${g}% lebar=${w}m ... panjang ${nf(roadLen(),0)} m untuk turun ${pitGeo().depth} m`,g>10?'warn':'ok');if(g>10)LOG('PERINGATAN: gradien melebihi 10% (batas umum jalan angkut)','warn')}
  if(c==='dump'){const l=gv('c-l');if(!(l>=2&&l<=10)){LOG('ERROR WASTE DUMP: jumlah lift 2–10','err');return}ST.dump.lifts=l;rebuild('dump');const D=dumpGeo();
    LOG(`WASTE DUMP ${l} lift (${D.H} m) ... kapasitas ${nf(D.cap/1e6,2)} Mm³, kebutuhan waste 2026 ${nf(D.need/1e6,2)} Mm³ (swell 1,3)`,D.cap>=D.need?'ok':'warn');if(D.cap<D.need)LOG('PERINGATAN: kapasitas dump kurang dari kebutuhan waste tahun 2026','warn')}
  if(c==='vol'){const v=calcVol();LOG(`VOLUME cut-off ${nf(ST.cut,2)} g/t ... ${IDN(v.n)} blok · ${IDN(v.vol)} m³ · ${IDN(Math.round(v.t))} t · Au ${nf(v.ga,2)} g/t · ${IDN(Math.round(v.oz))} oz in situ · ${IDN(Math.round(v.rec))} oz recoverable (91,2%)`,'ok');ST.sel={kind:'layer',k:'blocks'};highlight();drawProps()}
  if(c==='stat'){const g=ST.blocks.map(b=>b.g),m=g.reduce((a,b)=>a+b,0)/g.length,sd=Math.sqrt(g.reduce((a,b)=>a+(b-m)*(b-m),0)/g.length);LOG(`STATS bm_au_v3 ... n=${g.length} · rata-rata ${nf(m,2)} · SD ${nf(sd,2)} · CV ${nf(sd/m,2)} · maks ${nf(Math.max(...g),2)} g/t`,'ok')}
  if(c==='opt'){const p=gv('c-p'),k=p*.912/31.1035*.9625;let val=0,pos=0;ST.blocks.forEach(b=>{const v=2700*(b.g*k-(b.g>=ST.cut?6.6+11.35+3:6.6));if(b.g>=ST.cut&&v>0){val+=v;pos++}});
    LOG(`BLOCK VALUE harga USD ${IDN(p)}/oz (royalti 3,75%, tambang USD 6,6/t, proses USD 11,35/t, G&A USD 3/t) ... ${IDN(pos)} blok bernilai positif, margin ${nf(val/1e6,1)} juta USD (tanpa diskonto)`,'ok')}
  if(c==='pipe'){const q=ST.steps.filter(s=>!s[1]);if(!q.length){ST.steps.forEach(s=>s[1]=0);ST.steps.slice(0,4).forEach(s=>s[1]=1);drawLayers()}
    const go=()=>{const s=ST.steps.find(x=>!x[1]);if(!s)return;setTimeout(()=>{s[1]=1;LOG('PIPELINE '+s[0]+' ... selesai','ok');if(s[0]==='Optimasi pit'){cmd('opt')}if(s[0]==='Penjadwalan produksi')LOG(`SCHEDULE 2026–2030 ... bijih ${IDN(SCH.ore.reduce((a,b)=>a+b))} kt, waste ${IDN(SCH.waste.reduce((a,b)=>a+b))} kt`,'ok');drawLayers();go()},450)};go()}
}

    allOn = !allOn;
    c.querySelectorAll('.rep-check').forEach(cb=>cb.checked=allOn);

function generateExcel(){
  const selected = [...document.querySelectorAll('.rep-check:checked')].map(cb=>cb.value);
  if(!selected.length || !window.XLSX){ alert('Pilih minimal satu modul untuk dimasukkan ke laporan.'); return; }
  const rows = [];
  selected.forEach(id=>{
    const m = MOD[id];
    (m.kpi||[]).forEach(k=> rows.push({Modul:m.t, Item:k[0], Nilai:k[1]}));
    (m.rows||[]).forEach(r=> rows.push({Modul:m.t, Item:r[0], Nilai:r[1], Status:r.slice(2).join(' | ')}));
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Laporan AURUM');
  XLSX.writeFile(wb, 'laporan-tambang-emas-aurum.xlsx');
}

function generatePDF(){
  const selected = [...document.querySelectorAll('.rep-check:checked')].map(cb=>cb.value);
  if(!selected.length){ alert('Pilih minimal satu modul untuk dimasukkan ke laporan.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(17); doc.setTextColor(30,25,20); doc.text('Laporan Operasional — Tambang Emas AURUM', 14, y); y+=7;
  doc.setFontSize(10); doc.setTextColor(110,100,85);
  doc.text('Dibuat pada ' + new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}), 14, y); y+=10;
  doc.setDrawColor(201,154,63); doc.line(14,y,196,y); y+=8;

  selected.forEach(id=>{
    const m = MOD[id];
    if(y > 265){ doc.addPage(); y = 20; }
    doc.setFontSize(13); doc.setTextColor(30,25,20); doc.text(m.t, 14, y); y+=6;
    doc.setFontSize(9.5); doc.setTextColor(90,82,70);
    const descLines = doc.splitTextToSize(m.d, 180);
    doc.text(descLines, 14, y); y += descLines.length*4.6 + 3;
    doc.setFontSize(10); doc.setTextColor(50,44,36);
    (m.kpi||[]).forEach(k=>{
      if(y>280){ doc.addPage(); y=20; }
      doc.text(`•  ${k[0]}:  ${k[1]}`, 16, y); y+=5.5;
    });
    if(m.rows){
      m.rows.forEach(r=>{
        if(y>280){ doc.addPage(); y=20; }
        doc.setFontSize(8.5); doc.setTextColor(110,100,85);
        doc.text(`   ${r.join(' — ')}`, 16, y); y+=4.6;
      });
    }
    y += 6;
  });
  doc.save('laporan-tambang-emas-aurum.pdf');
}

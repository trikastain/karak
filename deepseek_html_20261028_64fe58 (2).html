<!DOCTYPE html>

<head>

<title>Portal Dokumen Teknis — PT Bara Sesayap Nusantara</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#0f172a;--ink-2:#334155;--muted:#64748b;--line:#e2e8f0;--line-2:#cbd5e1;--brand:#f59e0b;--brand-2:#b45309;--brand-soft:#fef3c7;--side:#0b1220;--side-ink:#94a3b8;--ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--draft:#475569;--draft-bg:#e2e8f0;--radius:14px;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#c3ccda;border-radius:8px;border:2px solid var(--bg)}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#0b1220,#101a2c);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid rgba(148,163,184,.14)}
.brand-logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#b45309);display:grid;place-items:center;font-weight:800;font-size:15px;color:#1c1206;flex:0 0 auto;box-shadow:0 6px 16px -6px rgba(245,158,11,.8)}
.brand-name{font-size:13.5px;font-weight:700;color:#f1f5f9;line-height:1.25}
.brand-sub{font-size:11px;color:#7c8ba3;margin-top:3px}
.nav-scroll{overflow-y:auto;padding:14px 12px 24px;flex:1}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5d6b82;padding:12px 10px 8px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:#a9b6c9;font-size:13px;font-weight:500;transition:.16s;margin-bottom:2px;border:1px solid transparent}
.nav-item:hover{background:rgba(148,163,184,.1);color:#e2e8f0}
.nav-item.active{background:linear-gradient(90deg,rgba(245,158,11,.18),rgba(245,158,11,.04));color:#fbbf24;border-color:rgba(245,158,11,.28);font-weight:600}
.nav-item .ic{width:22px;text-align:center;font-size:14px;flex:0 0 auto}
.nav-item .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(148,163,184,.16);color:#93a3b8;padding:2px 7px;border-radius:20px}
.nav-item.active .cnt{background:rgba(245,158,11,.22);color:#fbbf24}
.side-foot{padding:14px 16px;border-top:1px solid rgba(148,163,184,.14);font-size:11px;color:#5d6b82;line-height:1.6}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:6px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:500;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:0 26px;height:64px;display:flex;align-items:center;gap:16px}
.burger{display:none;background:none;border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-size:15px;color:var(--ink-2)}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--ink);font-weight:600}.crumb .sep{color:#cbd5e1}
.search{margin-left:auto;position:relative}
.search input{width:290px;padding:9px 13px 9px 36px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:13px;color:var(--ink);outline:none;transition:.16s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(245,158,11,.16);width:340px}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:13px}
.suggest{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;max-height:340px;overflow-y:auto;display:none;z-index:900}
.suggest.open{display:block}
.suggest a{display:block;padding:10px 14px;font-size:12.5px;border-bottom:1px solid #f1f5f9;color:var(--ink-2)}
.suggest a:hover{background:#fff7ed}
.suggest a span{color:var(--muted);font-size:11px;display:block;margin-top:2px}
.content{padding:26px 26px 60px;max-width:1400px;width:100%}
.page-head{margin-bottom:22px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px}
.page-desc{color:var(--muted);font-size:13.5px;max-width:760px;line-height:1.65}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--brand)}
.kpi.k2::after{background:#16a34a}.kpi.k3::after{background:#2563eb}.kpi.k4::after{background:#9333ea}
.kpi-lbl{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.kpi-val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:14px;font-weight:700}
.card-h .sub{font-size:11.5px;color:var(--muted);margin-left:auto}
.card-b{padding:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:10px}

.dcard-top{display:flex;align-items:center;gap:9px}
.dcode{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--brand-2);background:var(--brand-soft);padding:3px 8px;border-radius:6px}
.dtype{font-size:10.5px;color:var(--muted);margin-left:auto}
.dtitle{font-size:13.5px;font-weight:700;line-height:1.4;color:var(--ink)}
.dmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.draft{background:var(--draft-bg);color:var(--draft)}.badge.ghost{background:#f1f5f9;color:var(--muted)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:11.5px;background:#f8fafc;border:1px solid var(--line);padding:5px 11px;border-radius:8px;color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:700}
.doc-grid{display:grid;grid-template-columns:1fr 316px;gap:18px;align-items:start}
.map-wrap{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
#map{height:540px;width:100%;background:#dbeafe;z-index:1}
.map-panel{position:absolute;top:12px;right:12px;z-index:600;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:214px;font-size:12px;overflow:hidden}
.mp-title{padding:9px 12px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:#f8fafc}
.mp-body{padding:8px 12px 12px}
.lrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11.5px;color:var(--ink-2)}
.lrow input{accent-color:var(--brand);cursor:pointer;margin:0}
.swatch{width:12px;height:12px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.18)}
.basemaps{display:flex;gap:6px;padding:8px 12px 12px}
.basemaps button{flex:1;font-size:11px;padding:6px 4px;border-radius:7px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);font-weight:600;transition:.15s}
.basemaps button.active{background:var(--brand);border-color:var(--brand);color:#1f1300}
.leaflet-control-attribution{font-size:9.5px !important}
table.spec{width:100%;border-collapse:collapse;font-size:12.5px}
table.spec th,table.spec td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.spec th{color:var(--muted);font-weight:600;width:44%;font-size:12px}
table.spec td{font-weight:600;color:var(--ink-2)}
.drawing{background:#fbfdff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
#drawingContainer{width:100%;background:#fff;min-height:400px;position:relative}
#drawingContainer svg{display:block;width:100%;height:auto}
#threeContainer{width:100%;height:560px;background:#0f172a;position:relative}
#threeContainer canvas{display:block;width:100%!important;height:100%!important}
.chart-wrap{position:relative;height:340px}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.info-row:last-child{border-bottom:none}.info-row span{color:var(--muted)}.info-row b{font-weight:700;text-align:right}
.docnav{display:flex;gap:10px;margin-top:18px}
.docnav a{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);transition:.16s}
.docnav a:hover{border-color:#fcd34d;background:#fffdf7}
.docnav .dir{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.docnav .tt{font-size:12.5px;font-weight:700;margin-top:4px;line-height:1.35}
.docnav .disabled{opacity:.42;pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-size:12.5px;font-weight:700;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);transition:.15s}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#1f1300}
.btn.primary:hover{background:#fbbf24}
.legend-badge{display:inline-block;font-size:10px;color:#64748b;background:#f1f5f9;padding:4px 10px;border-radius:6px;border:1px solid var(--line);margin:0 4px 4px 0}
@media (max-width:1180px){.grid-2{grid-template-columns:1fr}.doc-grid{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:272px;z-index:1000;transform:translateX(-100%);transition:.24s}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .burger{display:block}
  .search input{width:170px}.search input:focus{width:210px}
  .content{padding:18px 14px 50px}.topbar{padding:0 14px;gap:10px}
  #map{height:400px}
}
</style>
</head>

</div>

<script>
/* ==================== DATA ==================== */
const COMPANY = {name:'PT Bara Sesayap Nusantara', short:'BSN', iup:'IUP OP No. 4590/KPT/2024', area:'4.590 Ha', location:'Kec. Sesayap, Kab. Tana Tidung, Kalimantan Utara', center:[3.5525,117.0490]};
const IUP_BOUNDARY = [[3.5800,117.0210],[3.5835,117.0455],[3.5760,117.0705],[3.5605,117.0820],[3.5410,117.0790],[3.5265,117.0640],[3.5220,117.0420],[3.5310,117.0225],[3.5520,117.0155],[3.5700,117.0170]];
const BBOX = { s:3.5220, n:3.5835, w:117.0155, e:117.0820 };
const CATEGORIES = [
  { id:'A', name:'Peta & Geologi', icon:'🗺️', items:['Peta Topografi Wilayah Izin Usaha Pertambangan (IUP)','Peta Geologi Regional dan Lokal','Peta Singkapan Batubara (Outcrop Map)','Peta Struktur Geologi dan Sesar (Fault)','Peta Ketebalan Lapisan Batubara (Isopach Map)','Peta Kualitas Batubara (Iso-Ash, Iso-Sulfur)','Peta Sebaran Titik Bor (Drill Hole Location Map)','Penampang Geologi Vertikal (Cross Section)','Penampang Stratigrafi Batubara','Peta Batas Wilayah Konsesi / IUP (Boundary Map)','Peta Penggunaan Lahan (Land Use / Land Cover)','Peta Kepemilikan Tanah dan Tanam Tumbuh','Peta Potensi Air Tanah (Hydrogeology Map)','Peta Lereng dan Kemiringan (Slope Contour Map)','Peta Model Blok Sumberdaya dan Cadangan']},
  { id:'B', name:'Desain Tambang & Geoteknik', icon:'⛏️', items:['Peta Rencana Penambangan Jangka Panjang','Peta Rencana Penambangan Jangka Menengah','Peta Rencana Penambangan Bulanan / Tahunan','Desain Akhir Lubang Tambang (Final Pit Limit)','Desain Tahapan Penambangan (Pit Phasing / Pushback)','Detail Geometri Jenjang (Bench Geometry)','Peta Penempatan Batuan Penutup (Disposal Plan)','Desain Geometri Waste Dump (Crest & Toe)','Peta Analisis Stabilitas Lereng Tambang','Peta Analisis Stabilitas Lereng Disposal','Detail Alat Pemantau Pergerakan Lereng','Peta Rute Alat Muat dan Alat Angkut','Tipikal Potongan Melintang Jalan Angkut','Detail Tikungan Jalan Tambang (Superelevasi)','Desain Jembatan Timbang (Weighbridge)','Peta Lokasi Fasilitas Pendukung Tambang','Peta Cadangan Batubara Tertinggal dan Pilar Pengaman','Desain Sump dan Kolam Penampung Air','Peta Akses Evakuasi Darurat Tambang','Desain Batas Aman Terhadap Fasilitas Umum']},
  { id:'C', name:'Hidrologi & Pengolahan Air', icon:'💧', items:['Peta Daerah Tangkapan Hujan (Catchment Area)','Desain Sistem Drainase Bukaan Tambang','Desain Saluran Terbuka dan Paritan','Detail Gorong-gorong dan Jembatan Air','Peta Aliran Air Limpasan (Run-off Flow Map)','Desain Kolam Pengendapan Lumpur (Settling Pond)','Detail Struktur Pintu Air dan Spillway','Desain Unit Penetralan Air Asam Tambang (AAT)','Peta Titik Pemantauan Kualitas Air','Desain Sumur Pantau Air Tanah','Desain Sistem Dewatering (Pompa & Pipa)','Skema Alur Perpipaan Air Tambang','Desain Sumur Bor Suplai Air Bersih','Detail Instalasi Pengolahan Air Bersih (WTP)','Detail Instalasi Pengolahan Air Limbah (WWTP)']},
  { id:'D', name:'Coal Handling & Preparation Plant', icon:'🏭', items:['Peta Tata Letak Coal Handling and Processing Plant','Diagram Alir Proses Pengolahan Batubara (P&ID CHP)','Desain Hopper dan Feeder Penerimaan Batubara','Desain Belt Conveyor Utama dan Transfer Tower','Detail Struktur Pondasi Belt Conveyor dan Gallery','Desain Crushing Plant (Rumah Crusher)','Desain Screening Plant (Ayakan Batubara)','Desain Stockpile Batubara (Geometri & Kapasitas)','Desain Sistem Stacker dan Reclaimer','Desain Rapid Loading System (RLS) / Silo','Desain Pelabuhan Khusus / Jetty Batubara','Desain Fender dan Dolphin Jetty','Desain Trestle dan Conveyor Menuju Jetty','Desain Sistem Pemadam Kebakaran CHP & Stockpile','Detail Instalasi Water Spray Penekan Debu','Desain Magnet Separator dan Metal Detector','Desain Laboratorium Uji Kualitas Batubara','Detail Jembatan Penyeberangan Konveyor','Desain Drainase Area Stockpile dan Slurry','Desain Kolam Pencuci Batubara (Washery Plant)']},
  { id:'E', name:'Infrastruktur, Sipil & Arsitektur', icon:'🏗️', items:['Master Plan Kawasan Industri Tambang','Desain Perkantoran Utama Site (Mine Office)','Desain Mess Karyawan dan Fasilitas Umum','Desain Mess Hall / Dapur dan Ruang Makan','Desain Klinik / Rumah Sakit Tambang','Desain Gudang Bahan Peledak (Magazine Handak)','Desain Pagar Keliling dan Pos Keamanan','Desain Bengkel Utama Alat Berat (Main Workshop)','Desain Gudang Suku Cadang (Warehouse)','Desain Tempat Pencucian Alat Berat (Wash Bay)','Desain Tangki Bahan Bakar (Fuel Farm)','Detail Fondasi Tangki Bahan Bakar dan Bund Wall','Desain Tempat Pembuangan Limbah B3','Desain Landasan Helikopter (Helipad)','Desain Pagar Pembatas Pengaman Tebing dan Jurang']},
  { id:'F', name:'Mekanikal, Elektrikal & Utilitas', icon:'⚡', items:['Diagram Satu Garis Distribusi Listrik Utama','Peta Jaringan Gardu Induk (Substation Layout)','Peta Jaringan Tiang Listrik dan Kabel Tegangan','Desain Rumah Genset dan Pembangkit Cadangan','Sistem Penerangan Jalan Umum dan Area Kerja','Sistem Penangkal Petir Area Perkantoran & Stockpile','Skema Jaringan Telekomunikasi dan Radio Tower','Skema Perpipaan Udara Bertekanan (Compressed Air)','Desain Sistem Alarm Kebakaran dan Hidran Kawasan','Desain Sistem Pengolahan Sampah Domestik']},
  { id:'G', name:'Lingkungan & Reklamasi', icon:'🌱', items:['Peta Rencana Reklamasi dan Revegetasi Tahunan','Desain Penataan Lahan Pascatambang (Mine Closure)','Peta Persebaran Lokasi Topsoil Tersimpan','Desain Drainase Akhir Lahan Reklamasi & Terasering','Peta Monitor Keanekaragaman Hayati & Batas Hutan Lindung']}
];

/* Doc type map: 1-100 */
const DOC_TYPE = {1:'map',2:'map',3:'map',4:'map',5:'map',6:'map',7:'map',8:'section',9:'section',10:'map',11:'map',12:'map',13:'map',14:'map',15:'three',16:'map',17:'map',18:'map',19:'map',20:'map',21:'section',22:'map',23:'section',24:'map',25:'map',26:'map',27:'map',28:'section',29:'section',30:'plan',31:'map',32:'map',33:'plan',34:'map',35:'map',36:'map',37:'map',38:'section',39:'section',40:'map',41:'plan',42:'section',43:'diagram',44:'map',45:'section',46:'diagram',47:'diagram',48:'section',49:'diagram',50:'diagram',51:'map',52:'diagram',53:'plan',54:'plan',55:'section',56:'plan',57:'plan',58:'plan',59:'plan',60:'plan',61:'map',62:'section',63:'section',64:'plan',65:'diagram',66:'plan',67:'plan',68:'section',69:'plan',70:'plan',71:'map',72:'plan',73:'plan',74:'plan',75:'plan',76:'plan',77:'plan',78:'plan',79:'plan',80:'plan',81:'plan',82:'section',83:'plan',84:'plan',85:'section',86:'diagram',87:'map',88:'map',89:'plan',90:'map',91:'plan',92:'map',93:'diagram',94:'diagram',95:'diagram',96:'map',97:'map',98:'map',99:'section',100:'map'};
const PIC = ['Ir. Andi Pratama','Rizky Hidayat, S.T.','Dewi Lestari, S.T.','Bayu Nugroho, S.T.','Siti Rahmawati, S.T.','Hendra Wijaya','M. Fauzi, S.T.','Yuliana Sari'];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const DOCS = (() => {
  const out = []; let n = 0;
  CATEGORIES.forEach(cat => cat.items.forEach((title, i) => {
    n++; const r = mulberry32(n * 104729);
    const statuses = ['Approved','Approved','Approved','Review','Draft'];
    const status = statuses[Math.floor(r()*statuses.length)];
    const month = String(1 + Math.floor(r()*9)).padStart(2,'0');
    const day = String(1 + Math.floor(r()*27)).padStart(2,'0');
    out.push({ id:n, cat:cat.id, catName:cat.name, code:`BSN-${cat.id}-${String(i+1).padStart(2,'0')}`, title, type:DOC_TYPE[n]||'map', status, rev:`Rev. ${Math.floor(r()*4)}`, date:`2025-${month}-${day}`, pic:PIC[Math.floor(r()*PIC.length)], scale:['1:5.000','1:10.000','1:2.000','1:25.000','1:1.000'][Math.floor(r()*5)], sheet:'A1', pages:1 + Math.floor(r()*8) });
  }));

function pointInPoly(pt, poly){const [y,x]=pt;let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [yi,xi]=poly[i],[yj,xj]=poly[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function randPoint(rng){for(let i=0;i<400;i++){const p=[BBOX.s+rng()*(BBOX.n-BBOX.s),BBOX.w+rng()*(BBOX.e-BBOX.w)];if(pointInPoly(p,IUP_BOUNDARY))return p;}return COMPANY.center;}
function randPoints(rng,n){const out=[];for(let i=0;i<n;i++)out.push(randPoint(rng));return out;}
function blob(cLat,cLng,radius,rng,seg=9){const out=[];for(let i=0;i<seg;i++){const a=i/seg*Math.PI*2;const rr=radius*(0.62+rng()*0.75);out.push([cLat+Math.sin(a)*rr,cLng+Math.cos(a)*rr*0.94]);}return out;}

function wavyLines(rng,count){const out=[];for(let i=0;i<count;i++){const lat0=BBOX.s+(i+0.5)*(BBOX.n-BBOX.s)/count;const pts=[];for(let x=BBOX.w-0.006;x<=BBOX.e+0.006;x+=0.0035){pts.push([lat0+Math.sin(x*320+i*1.7)*0.0016+(rng()-0.5)*0.0005,x]);}out.push(pts);}return out;}
function crossLines(rng,count,angle){const out=[];for(let i=0;i<count;i++){const off=(rng()-0.5)*0.045;const pts=[];for(let t=-0.06;t<=0.06;t+=0.008){pts.push([3.5525+t*Math.sin(angle)+off,117.0490+t*Math.cos(angle)+Math.sin(t*40+i)*0.0012]);}out.push(pts);}return out;}
function blockGrid(rng,colors,step){const out=[];for(let lat=BBOX.s;lat<BBOX.n;lat+=step){for(let lng=BBOX.w;lng<BBOX.e;lng+=step){const c=[lat+step/2,lng+step/2];if(!pointInPoly(c,IUP_BOUNDARY))continue;out.push({coords:[[lat,lng],[lat,lng+step],[lat+step,lng+step],[lat+step,lng]],color:colors[Math.floor(rng()*colors.length)]});}}return out;}

function layersFor(doc){const rng=mulberry32(doc.id*2654435761%2147483647);const layers=[L_poly('iup','Batas IUP',IUP_BOUNDARY,'#f59e0b',0.05,3)];const fn=MAP_EXTRA[doc.id]||CAT_DEF[doc.cat]||(()=>[]);fn(rng).forEach(l=>layers.push(l));return layers;}
let mapInstance=null;
function drawLayerInto(group, spec){
  const {type}=spec;
  if(type==='poly')L.polygon(spec.coords,{color:spec.color,weight:spec.weight||2,fillColor:spec.color,fillOpacity:spec.fill??0.1}).addTo(group);
  if(type==='polys')spec.list.forEach(it=>L.polygon(it.coords,{color:it.color,weight:2,fillColor:it.color,fillOpacity:0.22}).bindTooltip(it.label||'',{sticky:true}).addTo(group));
  if(type==='line')L.polyline(spec.coords,{color:spec.color,weight:spec.weight||3,dashArray:spec.dash||null}).addTo(group);
  if(type==='lines')spec.list.forEach(pts=>L.polyline(pts,{color:spec.color,weight:spec.weight||1.6,opacity:.85}).addTo(group));
  if(type==='points')spec.coords.forEach((pt,i)=>L.circleMarker(pt,{radius:spec.radius||6,color:'#fff',weight:1.6,fillColor:spec.color,fillOpacity:.95}).bindTooltip(`${spec.name} #${i+1}`,{direction:'top'}).addTo(group));
  if(type==='blocks')spec.list.forEach(b=>L.polygon(b.coords,{color:b.color,weight:.4,fillColor:b.color,fillOpacity:.7}).addTo(group));
}
function initMap(doc, layers){
  const el=document.getElementById('map');if(!el)return;
  const map=L.map(el,{zoomControl:true}).setView(COMPANY.center,13);
  mapInstance=map;
  const bases={
    imagery:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}),
    topo:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'}),
    streets:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'})
  };
  bases.imagery.addTo(map);
  const groups={};
  layers.forEach(spec=>{const g=L.layerGroup().addTo(map);drawLayerInto(g,spec);groups[spec.id]=g;});
  const list=document.getElementById('layerList');
  if(list){
    list.innerHTML=layers.map(l=>{let color=l.color;if(l.type==='polys'||l.type==='blocks')color=l.list[0]?.color||l.color;return `<label class="lrow"><input type="checkbox" data-lid="${l.id}" checked><span class="swatch" style="background:${color}"></span><span>${escapeHtml(l.name)}</span></label>`;}).join('');
    list.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{const g=groups[e.target.dataset.lid];if(!g)return;if(e.target.checked)g.addTo(map);else map.removeLayer(g);}));
  }
  document.querySelectorAll('.basemaps button').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.basemaps button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');Object.values(bases).forEach(b=>map.removeLayer(b));bases[btn.dataset.base].addTo(map);
  }));
  setTimeout(()=>{map.fitBounds(L.latLngBounds(IUP_BOUNDARY),{padding:[36,36]});map.invalidateSize();},120);
}

  poly(pts,o={}){const d=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')+(o.closed!==false?' Z':'');return this.path(d,o);}

  patPoly(pts,pid,o={}){const d=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')+' Z';return this.patL.append('path').attr('d',d).attr('fill',`url(#${pid})`).attr('stroke',o.stroke||'#64748b').attr('stroke-width',o.w||0.8);}

  text(x,y,str,o={}){const el=this.textL.append('text').attr('x',x).attr('y',y).attr('fill',o.fill||'#0f172a').attr('font-family',o.family||'Inter, system-ui, sans-serif').attr('font-size',o.size||11).attr('font-weight',o.weight||400).attr('font-style',o.style||'normal').attr('text-anchor',o.anchor||'start').attr('dominant-baseline',o.baseline||'middle');if(o.rotate!==undefined)el.attr('transform',`rotate(${o.rotate} ${x} ${y})`);el.text(str);return el;}
  _arrow(x,y,angle,color){const s=8;const p1=[x,y];const p2=[x+s*Math.cos(angle+2.75),y+s*Math.sin(angle+2.75)];const p3=[x+s*Math.cos(angle-2.75),y+s*Math.sin(angle-2.75)];this.dimL.append('polygon').attr('points',[p1,p2,p3].map(p=>p.join(',')).join(' ')).attr('fill',color);}
  dimH(x1,x2,y,label,o={}){const color=o.color||'#dc2626';if(o.yFrom!==undefined){const ext=8;this.dimL.append('line').attr('x1',x1).attr('y1',o.yFrom+(o.yFrom>y?-2:2)).attr('x2',x1).attr('y2',y+(o.yFrom>y?ext:-ext)).attr('stroke',color).attr('stroke-width',0.8);this.dimL.append('line').attr('x1',x2).attr('y1',o.yFrom+(o.yFrom>y?-2:2)).attr('x2',x2).attr('y2',y+(o.yFrom>y?ext:-ext)).attr('stroke',color).attr('stroke-width',0.8);}this.dimL.append('line').attr('x1',x1).attr('y1',y).attr('x2',x2).attr('y2',y).attr('stroke',color).attr('stroke-width',1.2);this._arrow(x1,y,0,color);this._arrow(x2,y,Math.PI,color);this.text((x1+x2)/2,y-11,label,{anchor:'middle',size:o.size||11,weight:700,fill:color});}

function titleBlock(t, title, subtitle){

function cLegend(t,x,y,w,h,title,items){
  t.rect(x,y,w,h,{fill:'#fff',stroke:'#94a3b8',w:1.5,rx:6});
  t.text(x+12,y+18,title,{size:10.5,weight:800});

  const cols=2,colW=(w-24)/cols,perCol=Math.ceil(items.length/cols),rowH=Math.min(26,(h-48)/perCol);
  items.forEach((it,i)=>{
    const c=Math.floor(i/perCol),r=i%perCol;
    const ix=x+12+c*colW,iy=y+46+r*rowH;
    if(it.pattern)t.patRect(ix,iy,22,12,it.pattern,{stroke:'#64748b',w:0.5});
    else if(it.color)t.rect(ix,iy,22,12,{fill:it.color,stroke:'#64748b',w:0.5});
    else if(it.line)t.line(ix,iy+6,ix+22,iy+6,{stroke:it.line,w:2});
    else if(it.dash)t.line(ix,iy+6,ix+22,iy+6,{stroke:it.dash,w:2,dash:'6 3'});
    t.text(ix+28,iy+6,it.label,{size:9,fill:'#334155'});
  });
}
function cSpec(t,x,y,w,h,title,rows,opts={}){
  t.rect(x,y,w,h,{fill:opts.fill||'#f8fafc',stroke:'#94a3b8',w:1.5,rx:6});
  t.text(x+12,y+18,title,{size:10.5,weight:800,fill:opts.titleColor||'#0f172a'});
  t.line(x+12,y+30,x+w-12,y+30,{stroke:'#cbd5e1',w:0.8});
  const cols=opts.cols||2,colW=(w-24)/cols,perCol=Math.ceil(rows.length/cols),rowH=Math.min(20,(h-48)/perCol);
  rows.forEach((r,i)=>{
    const c=Math.floor(i/perCol),rr=i%perCol;
    const ix=x+12+c*colW,iy=y+48+rr*rowH;
    t.text(ix,iy,r[0],{size:8.5,fill:'#475569'});
    t.text(ix+colW-16,iy,r[1],{anchor:'end',size:8.5,weight:700});
  });
}
function cNotes(t,x,y,w,h,title,notes){
  t.rect(x,y,w,h,{fill:'#fff',stroke:'#94a3b8',w:1.5,rx:6});
  t.text(x+12,y+18,title,{size:10.5,weight:800});
  t.line(x+12,y+30,x+w-12,y+30,{stroke:'#cbd5e1',w:0.8});
  const rowH=Math.min(18,(h-48)/notes.length);
  notes.forEach((n,i)=>{
    const iy=y+48+i*rowH;
    t.text(x+12,iy,`${i+1}.`,{size:8.5,fill:'#64748b',weight:700});
    t.text(x+26,iy,n,{size:8.5,fill:'#334155'});
  });
}
function bottomRow(t, panels){
  const y = 920, h = 140, xStart = 70, xEnd = 1180, gap = 16;
  const availW = (xEnd - xStart) - gap*(panels.length-1);
  const totalDeclared = panels.reduce((s,p)=>s+p.w, 0);
  let xCursor = xStart;
  panels.forEach(p => {
    const w = (p.w / totalDeclared) * availW;
    if(p.type==='legend') cLegend(t,xCursor,y,w,h,p.title,p.data);
    else if(p.type==='spec') cSpec(t,xCursor,y,w,h,p.title,p.data);
    else if(p.type==='notes') cNotes(t,xCursor,y,w,h,p.title,p.data);
    xCursor += w + gap;
  });
}

function outline(t, x, y, w, h, opt={}){

function annotLine(t, x1, y1, x2, y2, text, opt={}){

  t.circle(x1,y1,3,{fill:'#64748b'});

function sectionArrow(t, x, y, angle, label, opt={}){
  const dx = Math.cos(angle)*40, dy = Math.sin(angle)*40;

}

/* ==================== THREE.JS ==================== */
let activeThreeState = null;
function renderThree(doc){
  cleanupDrawings();
  const container = document.getElementById('threeContainer'); if (!container) return;
  container.innerHTML = '';
  const width = container.clientWidth || 800, height = container.clientHeight || 560;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);
  scene.fog = new THREE.FogExp2(0x0f172a, 0.004);
  const camera = new THREE.PerspectiveCamera(50, width/height, 0.1, 3000);
  camera.position.set(55, 45, 55); camera.lookAt(0, 0, 0);
  const renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(width, height); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const d1 = new THREE.DirectionalLight(0xffffff, 0.9); d1.position.set(50, 80, 40); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0xffd580, 0.35); d2.position.set(-40, 30, -30); scene.add(d2);
  const cells = 7, cellSize = 5;
  const colors = [0xdc2626, 0xf97316, 0xeab308, 0x22c55e, 0x0ea5e9, 0x7c3aed];
  const rng = mulberry32(42);
  for (let i=0;i<cells;i++) for (let j=0;j<cells;j++) for (let k=0;k<cells;k++){
    const dx=(i-cells/2+0.5)/(cells/2), dy=(k-cells/2+0.5)/(cells/2), dz=(j-cells/2+0.5)/(cells/2);
    const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
    if (dist > 1.0 || (rng() < 0.18 && dist > 0.55)) continue;
    const color = colors[Math.floor(rng()*colors.length)];
    const cube = new THREE.Mesh(new THREE.BoxGeometry(cellSize*0.92, cellSize*0.92, cellSize*0.92), new THREE.MeshLambertMaterial({color, transparent:dist>0.7, opacity:dist>0.7?0.72:0.95}));
    cube.position.set((i-cells/2+0.5)*cellSize, (k-cells/2+0.5)*cellSize, (j-cells/2+0.5)*cellSize);
    scene.add(cube);
  }
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshLambertMaterial({color:0x1e293b,transparent:true,opacity:0.35}));
  plane.rotation.x = -Math.PI/2; plane.position.y = -cells*cellSize/2; scene.add(plane);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.autoRotate = true; controls.autoRotateSpeed = 0.7;
  let animId;
  function animate(){ animId = requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
  animate();
  const ro = new ResizeObserver(() => {
    const w = container.clientWidth, h = container.clientHeight; if (!w || !h) return;
    camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
  });
  ro.observe(container);
  activeThreeState = {renderer, controls, scene, camera, animId, resizeObserver: ro};
}
function cleanupDrawings(){
  if (activeDraft){ try{activeDraft.clear();}catch(e){} activeDraft=null; }
  if (activeThreeState){
    try{
      cancelAnimationFrame(activeThreeState.animId);
      if (activeThreeState.resizeObserver) activeThreeState.resizeObserver.disconnect();
      if (activeThreeState.controls) activeThreeState.controls.dispose();
      if (activeThreeState.renderer){
        const c = activeThreeState.renderer.domElement;
        if (c && c.parentNode) c.parentNode.removeChild(c);
        activeThreeState.renderer.dispose();
      }
    }catch(e){}
    activeThreeState = null;
  }
}

function route(){
  cleanupDrawings();
  if (mapInstance){ mapInstance.remove(); mapInstance = null; }
  const hash = (location.hash || '#/dashboard').replace(/^#/, '');
  const parts = hash.split('/').filter(Boolean);
  const app = document.getElementById('app'), crumb = document.getElementById('crumb');
  let view, navActive = '';
  if (parts[0] === 'cat' && parts[1]){
    view = viewCategory(parts[1]);
    const cat = CATEGORIES.find(c=>c.id===parts[1]);
    navActive = 'cat-' + parts[1];
    crumb.innerHTML = `<a href="#/dashboard">Dashboard</a><span class="sep">/</span><b>${escapeHtml(cat ? cat.name : '')}</b>`;
  } else if (parts[0] === 'doc' && parts[1]){
    const id = parseInt(parts[1], 10);
    view = viewDoc(id);
    const d = DOCS.find(x=>x.id===id);
    if (d){
      navActive = 'cat-' + d.cat;
      crumb.innerHTML = `<a href="#/dashboard">Dashboard</a><span class="sep">/</span><a href="#/cat/${d.cat}">${escapeHtml(d.catName)}</a><span class="sep">/</span><b>${d.code}</b>`;
    }
  } else if (parts[0] === 'list'){
    view = viewList(); navActive = 'list';
    crumb.innerHTML = `<a href="#/dashboard">Dashboard</a><span class="sep">/</span><b>Semua Dokumen</b>`;
  } else {
    view = viewDashboard(); navActive = 'dashboard';
    crumb.innerHTML = `<b>Dashboard</b>`;
  }
  app.innerHTML = view.html;
  buildNav(navActive);
  window.scrollTo({top:0, behavior:'instant'});
  if (view.after) setTimeout(view.after, 30);
  document.getElementById('sidebar').classList.remove('open');
}

    if (q.length < 2){ box.classList.remove('open'); return; }
    const res = DOCS.filter(d => d.title.toLowerCase().includes(q) || d.code.toLowerCase().includes(q)).slice(0, 8);
    box.innerHTML = res.length ? res.map(d=>`<a href="#/doc/${d.id}"><span style="font-weight:700">${escapeHtml(d.title)}</span><span>${d.code} · ${escapeHtml(d.catName)}</span></a>`).join('') : `<a style="color:#94a3b8">Tidak ditemukan</a>`;
    box.classList.add('open');
  });
  box.addEventListener('click', () => { box.classList.remove('open'); input.value = ''; });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) box.classList.remove('open'); });
}
document.getElementById('burger').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('open'); });
window.addEventListener('hashchange', route);
initSearch();
route();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DED — PT Karak Ungol Bara | Detail Engineering Design Tambang Batubara</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --ink:#0f172a; --ink2:#475569; --muted:#94a3b8;
    --line:#e2e8f0; --brand:#f59e0b; --brand-d:#d97706; --brand-l:#fef3c7;
    --blue:#0ea5e9; --red:#ef4444; --violet:#8b5cf6; --cyan:#06b6d4;
    --brown:#78350f; --green:#16a34a; --slate:#334155;
    --sidebar:#0b1220; --sidebar-2:#111c30;
    --r:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  button,input,select{font:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:20px;border:3px solid transparent;background-clip:content-box}

  .app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
  .sidebar{background:linear-gradient(180deg,var(--sidebar) 0%,var(--sidebar-2) 100%);
    color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;gap:11px;align-items:center;padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
  .brand-logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(140deg,#f59e0b,#b45309);display:grid;place-items:center;
    font-size:22px;box-shadow:0 6px 18px -6px rgba(245,158,11,.8);color:#111}
  .brand b{display:block;color:#fff;font-size:14px}
  .brand small{display:block;color:#94a3b8;font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
  .nav{padding:10px 10px 18px;flex:1}
  .nav-group{margin-top:14px}
  .nav-group>span{display:block;padding:0 12px 7px;font-size:10.5px;letter-spacing:.9px;
    text-transform:uppercase;color:#64748b;font-weight:700}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;
    color:#cbd5e1;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;
    font-size:12.5px;transition:.16s;position:relative;margin-bottom:2px}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:rgba(245,158,11,.16);color:#fff}
  .nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
    background:var(--brand);border-radius:0 3px 3px 0}
  .nav-item i{font-style:normal;font-size:15px;width:20px;text-align:center}
  .nav-item .code{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.4px;
    background:rgba(255,255,255,.08);color:#94a3b8;padding:2px 6px;border-radius:5px}
  .nav-item.active .code{background:rgba(245,158,11,.25);color:#fcd34d}
  .side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:10.5px;color:#64748b;line-height:1.6}
  .side-foot b{color:#cbd5e1;display:block;font-size:11.5px;margin-bottom:3px}
  .side-foot .rev{color:#f59e0b;font-weight:700}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}
  .page-title h1{margin:0;font-size:17px}
  .page-title p{margin:1px 0 0;color:var(--muted);font-size:11.5px}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge-doc{display:flex;align-items:center;gap:7px;background:#f1f5f9;border:1px solid var(--line);
    border-radius:9px;padding:6px 11px;font-size:11px;font-weight:650;color:var(--ink2)}
  .badge-doc i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;
    display:grid;place-items:center;cursor:pointer;transition:.16s}
  .icon-btn:hover{border-color:#cbd5e1;background:#f8fafc}
  .user{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:30px;background:#fff}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#f59e0b,#b45309);
    color:#fff;display:grid;place-items:center;font-weight:700;font-size:11.5px}
  .user small{display:block;color:var(--muted);font-size:10.5px;line-height:1.1}
  .user b{font-size:12px;line-height:1.2}

  .content{padding:20px 24px 50px;flex:1;min-width:0}
  .subnav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#fff;
    border:1px solid var(--line);border-radius:12px;margin-bottom:18px;
    box-shadow:var(--shadow);position:sticky;top:64px;z-index:20}
  .subnav-item{border:1px solid transparent;background:#f8fafc;color:#475569;padding:7px 13px;
    border-radius:9px;cursor:pointer;font-size:12px;font-weight:650;transition:.16s;
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .subnav-item:hover{background:#eef2f7;color:#0f172a}
  .subnav-item.active{background:var(--brand);color:#111;box-shadow:0 4px 12px -4px rgba(245,158,11,.7)}
  .subnav-item .sn-ic{font-size:13px;opacity:.9}

  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .cols-2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
  .cols-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--brand);opacity:.9}
  .kpi.blue::after{background:var(--blue)} .kpi.red::after{background:var(--red)}
  .kpi.violet::after{background:var(--violet)} .kpi.cyan::after{background:var(--cyan)}
  .kpi.brown::after{background:var(--brown)} .kpi.green::after{background:var(--green)}
  .kpi.amber::after{background:#eab308}
  .kpi-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .kpi-label{font-size:11px;color:var(--ink2);font-weight:650}
  .kpi-ic{font-size:16px;opacity:.85}
  .kpi-val{font-size:22px;font-weight:750;letter-spacing:-.8px;margin:6px 0 4px;font-variant-numeric:tabular-nums}
  .kpi-val small{font-size:12px;font-weight:600;color:var(--muted)}
  .kpi-foot{display:flex;align-items:center;gap:8px;font-size:11px;flex-wrap:wrap}
  .delta{font-weight:700;padding:2px 7px;border-radius:20px;font-size:10.5px}
  .delta.up{color:#15803d;background:#dcfce7}
  .delta.down{color:#b91c1c;background:#fee2e2}
  .muted{color:var(--muted)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .card-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .card-hd h3{margin:0;font-size:13px;display:flex;align-items:center;gap:8px}
  .card-hd h3 .code{font-size:9.5px;font-weight:700;letter-spacing:.4px;background:#f1f5f9;color:#64748b;
    padding:2px 6px;border-radius:5px;border:1px solid var(--line)}
  .card-hd .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card-bd{padding:15px 16px;flex:1}
  .card-bd.tight{padding:8px 12px}
  .card-bd.flush{padding:0}

  .chart-wrap{position:relative;width:100%;height:240px}
  .chart-wrap.sm{height:190px}
  .chart-wrap.lg{height:300px}
  canvas{display:block;width:100%;height:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink2)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  .tbl-wrap{overflow:auto;max-height:480px}
  table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  table.tbl thead th{position:sticky;top:0;background:#f8fafc;text-align:left;padding:10px 13px;
    font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#64748b;
    border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;z-index:1}
  table.tbl td{padding:9px 13px;border-bottom:1px solid #f1f5f9;vertical-align:middle;white-space:nowrap}
  table.tbl tbody tr:hover{background:#f8fafc}
  table.tbl tbody tr:last-child td{border-bottom:0}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    padding:3px 9px;border-radius:20px;white-space:nowrap}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.ok{background:#dcfce7;color:#15803d}
  .badge.warn{background:#fef3c7;color:#b45309}
  .badge.bad{background:#fee2e2;color:#b91c1c}
  .badge.info{background:#e0f2fe;color:#0369a1}
  .badge.idle{background:#f1f5f9;color:#64748b}

  .progress{height:7px;background:#eef2f7;border-radius:20px;overflow:hidden;min-width:80px}
  .progress>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#fbbf24,#f59e0b)}

  .list{display:flex;flex-direction:column;gap:2px}
  .list-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #f1f5f9}
  .list-row:last-child{border-bottom:0}
  .list-row .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:#f1f5f9;font-size:15px;flex:0 0 auto}
  .list-row .tx{flex:1;min-width:0}
  .list-row .tx b{display:block;font-size:12.5px;font-weight:600}
  .list-row .tx small{color:var(--muted);font-size:11px}
  .list-row .rt{text-align:right;font-size:11.5px}

  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    border-bottom:1px dashed #eef2f7;font-size:12.5px;gap:10px}
  .stat-row:last-child{border-bottom:0}
  .stat-row b{font-variant-numeric:tabular-nums}
  .stat-row span:first-child{color:var(--ink2)}

  .btn{border:0;border-radius:10px;padding:9px 15px;font-weight:650;font-size:12.5px;cursor:pointer;transition:.16s}
  .btn.primary{background:var(--brand);color:#111}
  .btn.primary:hover{background:var(--brand-d);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}

  .callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;
    background:#fffbeb;border:1px solid #fde68a;font-size:12px;color:#92400e;line-height:1.55}
  .callout.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
  .callout.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
  .callout.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .callout .ic{font-size:16px;flex:0 0 auto}

  /* ============ SVG DRAWING PANEL (revised) ============ */
  .dwg{background:#0b1220;border-radius:12px;overflow:hidden;
    border:1px solid #1e293b;box-shadow:inset 0 0 40px rgba(0,0,0,.4);
    display:flex;flex-direction:column}
  .dwg-head{display:flex;align-items:center;gap:12px;padding:10px 14px;
    border-bottom:1px solid #1e293b;background:linear-gradient(180deg,#111c30,#0b1220);flex-wrap:wrap}
  .dwg-head .t{color:#e2e8f0;font-size:11.5px;font-weight:700;letter-spacing:.4px;line-height:1.35}
  .dwg-head .s{margin-left:auto;color:#7dd3fc;font-size:10px;font-weight:600;
    background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.28);
    padding:3px 9px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .dwg-body{padding:8px;background:radial-gradient(ellipse at center,rgba(30,41,59,.35),transparent 70%)}
  .dwg svg{width:100%;height:auto;display:block}
  .dwg-foot{padding:9px 14px;border-top:1px solid #1e293b;
    color:#94a3b8;font-size:10px;line-height:1.55;
    background:rgba(15,23,42,.7);display:flex;gap:8px;align-items:flex-start}
  .dwg-foot::before{content:"ℹ";color:#38bdf8;flex:0 0 auto;font-weight:700;font-size:11px}

  .mapviz{position:relative;background:#0f172a;border-radius:12px;overflow:hidden;
    aspect-ratio:16/10;border:1px solid #1e293b}
  .mapviz svg{width:100%;height:100%;display:block}
  .mapviz .legend-map{position:absolute;bottom:10px;left:10px;background:rgba(255,255,255,.96);
    border-radius:8px;padding:8px 10px;font-size:10.5px;color:#334155;
    box-shadow:0 2px 8px rgba(0,0,0,.25);line-height:1.55;max-width:45%;backdrop-filter:blur(2px)}
  .mapviz .legend-map b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
    color:#64748b;margin-bottom:5px}
  .mapviz .legend-map i{width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle}
  .mapviz .scalebar{position:absolute;bottom:10px;right:10px;background:rgba(255,255,255,.96);
    border-radius:6px;padding:5px 10px;font-size:10px;color:#334155;box-shadow:0 2px 8px rgba(0,0,0,.25);font-weight:600}
  .mapviz .north{position:absolute;top:12px;right:12px;width:34px;height:34px;
    background:rgba(255,255,255,.96);border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:11px;color:#334155;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .mapviz .north::before{content:"N";color:#ef4444;font-size:13px}

  .fade{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .section-title{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
  .section-title .num{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,#f59e0b,#b45309);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;
    box-shadow:0 6px 18px -6px rgba(245,158,11,.7);flex:0 0 auto}
  .section-title h2{margin:0;font-size:15px}
  .section-title p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}

  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;z-index:60;width:290px;transform:translateX(-100%);transition:.25s}
    .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(15,23,42,.45)}
    .hamb{display:block}
    .content{padding:14px 12px 40px}
    .topbar{padding:11px 14px}
    .subnav{top:56px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">⛏️</div>
      <div><b>PT Karak Ungol Bara</b><small>DED — Detail Engineering Design</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <b>Dokumen DED Rev. 2.0</b>
      IUP OP · 3.704 Ha · Kutai Kartanegara<br>
      <span class="rev">● Status: Final Draft</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="hamb" id="hamb">☰</button>
      <div class="page-title">
        <h1 id="pTitle">Overview DED</h1>
        <p id="pSub">Detail Engineering Design — PT Karak Ungol Bara</p>
      </div>
      <div class="topbar-right">
        <div class="badge-doc"><i></i> DED Rev. 2.0 · Sep 2026</div>
        <button class="icon-btn" title="Print">🖨️</button>
        <button class="icon-btn" title="Export">⬇️</button>
        <div class="user">
          <div class="avatar">AH</div>
          <div><b>Aditya Hermawan</b><small>KTT / Site Manager</small></div>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* =========================================================
   UTILITIES
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const num = n => (n ?? 0).toLocaleString('id-ID');
function fmtShort(v){
  const a = Math.abs(v);
  if(a >= 1e12) return (v/1e12).toFixed(1) + ' T';
  if(a >= 1e9)  return (v/1e9).toFixed(1) + ' M';
  if(a >= 1e6)  return (v/1e6).toFixed(1) + ' jt';
  if(a >= 1e3)  return Math.round(v/1e3) + ' rb';
  return String(Math.round(v));
}
const hexA = (hex,a) => {
  const n = parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
};
function kpi({label, value, delta, sub, icon='', tone=''}){
  const d = (delta === undefined || delta === null) ? '' :
    `<span class="delta ${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(1)}%</span>`;
  return `<div class="kpi ${tone}">
    <div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-ic">${icon}</span></div>
    <div class="kpi-val">${value}</div>
    <div class="kpi-foot">${d}<span class="muted">${sub||''}</span></div>
  </div>`;
}
function kpiRow(items){ return `<div class="grid kpis">${items.map(kpi).join('')}</div>`; }
function card(title, body, opts={}){
  const code = opts.code ? `<span class="code">${opts.code}</span>` : '';
  return `<section class="card">
    <header class="card-hd"><h3>${title}${code}</h3>${opts.actions?`<div class="actions">${opts.actions}</div>`:''}</header>
    <div class="card-bd ${opts.pad||''}">${body}</div>
  </section>`;
}
function table(headers, rows){
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}
function legend(items){
  return `<div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${i.label}</span>`).join('')}</div>`;
}
function badge(text, type='ok'){ return `<span class="badge ${type}">${text}</span>`; }
function statRow(label, val){ return `<div class="stat-row"><span>${label}</span><b>${val}</b></div>`; }
function callout(type, title, text){
  const ic = type==='ok'?'✅':type==='bad'?'⛔':type==='info'?'ℹ️':'⚠️';
  return `<div class="callout ${type}"><span class="ic">${ic}</span><div><b>${title}</b><br>${text}</div></div>`;
}
function sectionTitle(num, title, sub){
  return `<div class="section-title"><div class="num">${num}</div><div><h2>${title}</h2><p>${sub}</p></div></div>`;
}

/* =========================================================
   SVG DRAWING WRAPPER — REVISED (header/body/footer layout)
   Tidak ada lagi overlay yang menumpuk pada gambar.
   ========================================================= */
function dwg(title, svg, opts={}){
  const vbStr = opts.viewBox || '0 0 900 500';
  const parts = vbStr.trim().split(/\s+/).map(Number);
  const vx = parts[0] || 0, vy = parts[1] || 0;
  const vw = parts[2] || 900, vh = parts[3] || 500;
  const uid = opts.id || 'x';
  const scale = opts.scale ? `<span class="s">${opts.scale}</span>` : '';
  const foot = opts.note ? `<div class="dwg-foot">${opts.note}</div>` : '';
  return `<div class="dwg">
    <div class="dwg-head"><span class="t">${title}</span>${scale}</div>
    <div class="dwg-body">
      <svg viewBox="${vbStr}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dg-grid-${uid}" width="25" height="25" patternUnits="userSpaceOnUse">
            <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.6"/>
          </pattern>
          <linearGradient id="concrete-${uid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#64748b"/>
          </linearGradient>
          <linearGradient id="steel-${uid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/>
          </linearGradient>
          <linearGradient id="coal-${uid}" x1="0" y1="0" x2="0" y2="1">

/* =========================================================
   CHART ENGINE
   ========================================================= */
function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width  = Math.max(1, r.width  * dpr);
  cv.height = Math.max(1, r.height * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  return { ctx, w:r.width, h:r.height };
}
function roundRect(ctx,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function axes(ctx,w,h,pad,max,min=0){
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  ctx.font = '10.5px ui-sans-serif,system-ui';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const y = pad.t + ch*i/4;
    ctx.strokeStyle = i===4 ? '#cbd5e1' : '#eef2f7';
    ctx.beginPath(); ctx.moveTo(pad.l, y+.5); ctx.lineTo(pad.l+cw, y+.5); ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(fmtShort(max - (max-min)*i/4), pad.l-9, y);
  }
  return { cw, ch };
}
function xLabels(ctx,labels,pad,cw,ch){
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#94a3b8';
  ctx.font='10.5px ui-sans-serif,system-ui';
  const step = labels.length > 10 ? Math.ceil(labels.length/8) : 1;
  labels.forEach((lb,i)=>{
    if(i % step) return;
    const x = pad.l + (labels.length>1 ? cw*i/(labels.length-1) : cw/2);
    ctx.fillText(lb, x, pad.t+ch+8);
  });
}
function lineChart(cv, labels, series, opts={}){
  const {ctx,w,h} = setupCanvas(cv);
  const pad = {l:52,r:16,t:14,b:28};
  const all = series.flatMap(s=>s.data.filter(v=>v!=null));
  const min = opts.min0 === false ? Math.min(...all)*0.92 : 0;
  let max = Math.max(...all);
  max = max + (max-min)*0.16 || 1;
  const {cw,ch} = axes(ctx,w,h,pad,max,min);
  xLabels(ctx,labels,pad,cw,ch);
  series.forEach(s=>{
    const pts = s.data.map((v,i)=>({
      x: pad.l + (s.data.length>1 ? cw*i/(s.data.length-1) : cw/2),
      y: v==null ? null : pad.t + ch*(1-(v-min)/(max-min))
    })).filter(p=>p.y!=null);
    if(!pts.length) return;
    if(s.fill !== false){
      const g = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
      g.addColorStop(0, hexA(s.color,.26)); g.addColorStop(1, hexA(s.color,0));
      ctx.beginPath(); ctx.moveTo(pts[0].x, pad.t+ch);
      pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x, pad.t+ch);
      ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    }
    ctx.beginPath();
    pts.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.strokeStyle = s.color; ctx.lineWidth = 2.3;
    ctx.lineJoin='round'; ctx.lineCap='round';
    if(s.dash) ctx.setLineDash([6,5]); else ctx.setLineDash([]);
    ctx.stroke(); ctx.setLineDash([]);
    pts.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2);
      ctx.fillStyle='#fff'; ctx.fill();
      ctx.strokeStyle=s.color; ctx.lineWidth=1.8; ctx.stroke();
    });
  });
}
function barChart(cv, labels, series, opts={}){
  const {ctx,w,h} = setupCanvas(cv);
  const pad = {l:52,r:16,t:14,b:28};
  const max = Math.max(...series.flatMap(s=>s.data))*1.18 || 1;
  const {cw,ch} = axes(ctx,w,h,pad,max,0);
  const groupW = cw/labels.length;
  const barW = Math.min(30, (groupW*0.62)/series.length);
  labels.forEach((lb,i)=>{
    const gx = pad.l + groupW*i + groupW/2;
    series.forEach((s,j)=>{
      const v = s.data[i] || 0;
      const bh = ch*(v/max);
      const x = gx - (barW*series.length)/2 + j*barW;
      const y = pad.t + ch - bh;
      const g = ctx.createLinearGradient(0,y,0,pad.t+ch);
      g.addColorStop(0, s.color); g.addColorStop(1, hexA(s.color,.5));
      ctx.fillStyle = g;
      roundRect(ctx, x, y, Math.max(2,barW-4), bh, 4); ctx.fill();
    });
    ctx.fillStyle='#94a3b8'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font='10.5px ui-sans-serif,system-ui';
    ctx.fillText(lb, gx, pad.t+ch+8);
  });
}
function donutChart(cv, data, opts={}){
  const {ctx,w,h} = setupCanvas(cv);
  const cx = w/2, cy = h/2;
  const R = Math.min(w,h)/2 - 6;
  const r = R * 0.63;
  const total = data.reduce((a,b)=>a+b.value,0) || 1;
  let ang = -Math.PI/2;
  data.forEach(d=>{
    const a = d.value/total * Math.PI*2;
    ctx.beginPath(); ctx.arc(cx,cy,R,ang,ang+a); ctx.arc(cx,cy,r,ang+a,ang,true);
    ctx.closePath(); ctx.fillStyle = d.color; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    ang += a;
  });
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#0f172a';
  ctx.font = '700 18px ui-sans-serif,system-ui';
  ctx.fillText(opts.center ?? fmtShort(total), cx, cy - 7);
  ctx.font = '10.5px ui-sans-serif,system-ui';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(opts.sub ?? 'Total', cx, cy + 12);
}
function scatterChart(cv, points, opts={}){
  const {ctx,w,h} = setupCanvas(cv);
  const pad = {l:48,r:16,t:14,b:28};
  const xMin=opts.xMin??0, xMax=opts.xMax??10, yMin=opts.yMin??0, yMax=opts.yMax??2.2;
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  for(let i=0;i<=4;i++){
    const y = pad.t + ch*i/4;
    ctx.strokeStyle = i===4 ? '#cbd5e1' : '#eef2f7';
    ctx.beginPath(); ctx.moveTo(pad.l, y+.5); ctx.lineTo(pad.l+cw, y+.5); ctx.stroke();
    ctx.fillStyle='#94a3b8'; ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.font='10.5px ui-sans-serif,system-ui';
    ctx.fillText((yMax-(yMax-yMin)*i/4).toFixed(1), pad.l-9, y);
  }
  for(let i=0;i<=4;i++){
    const x = pad.l + cw*i/4;
    ctx.strokeStyle = '#f1f5f9';
    ctx.beginPath(); ctx.moveTo(x+.5, pad.t); ctx.lineTo(x+.5, pad.t+ch); ctx.stroke();
    ctx.fillStyle='#94a3b8'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText((xMin+(xMax-xMin)*i/4).toFixed(1), x, pad.t+ch+6);
  }
  if(opts.threshold){
    const ty = pad.t + ch*(1-(opts.threshold-yMin)/(yMax-yMin));
    ctx.strokeStyle='#ef4444'; ctx.setLineDash([6,5]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(pad.l, ty); ctx.lineTo(pad.l+cw, ty); ctx.stroke();
    ctx.setLineDash([]);
  }
  points.forEach(p=>{
    const x = pad.l + cw*(p.x-xMin)/(xMax-xMin);
    const y = pad.t + ch*(1-(p.y-yMin)/(yMax-yMin));
    ctx.beginPath(); ctx.arc(x,y,p.r||5,0,Math.PI*2);
    ctx.fillStyle = hexA(p.color||'#f59e0b',.75); ctx.fill();
    ctx.strokeStyle = p.color||'#f59e0b'; ctx.lineWidth=1.5; ctx.stroke();
  });
}

/* =========================================================
   ROUTER
   ========================================================= */
const NAV_ORDER = ['Dokumen','DED Sections'];

function buildNav(){
  const nav = $('#nav');
  nav.innerHTML = NAV_ORDER.map(group => {
    const items = Object.entries(PAGES).filter(([,p]) => p.group === group);
    if(!items.length) return '';
    return `<div class="nav-group"><span>${group}</span>
      ${items.map(([id,p]) => `
        <button class="nav-item" data-page="${id}">
          <i>${p.icon}</i>${p.title}
          <span class="code">${p.code||''}</span>
        </button>`).join('')}
    </div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      navigate(btn.dataset.page);
      $('#sidebar').classList.remove('open');
    });
  });
}
function updateNavActive(){
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
}

let currentPage = 'overview';

function renderSubNav(pageId){
  const p = PAGES[pageId];
  if(!p.subs) return '';
  const active = SUB_STATE[pageId] || Object.keys(p.subs)[0];
  return `<div class="subnav">${Object.entries(p.subs).map(([id,s])=>`
    <button class="subnav-item ${id===active?'active':''}" data-sub="${id}">
      ${s.icon?`<span class="sn-ic">${s.icon}</span>`:''}${s.title}
    </button>
  `).join('')}</div>`;
}

function navigate(id, subId){
  if(!PAGES[id]) return;
  currentPage = id;
  const p = PAGES[id];
  $('#pTitle').textContent = p.title;
  $('#pSub').textContent = p.sub;
  if(!SUB_STATE[id]) SUB_STATE[id] = Object.keys(p.subs)[0];
  if(subId) SUB_STATE[id] = subId;
  const activeSubId = SUB_STATE[id];
  const sub = p.subs[activeSubId];
  const content = $('#content');
  content.innerHTML = renderSubNav(id) + `<div id="subcontent">${sub.render()}</div>`;
  content.querySelectorAll('.subnav-item').forEach(btn => {
    btn.addEventListener('click', () => navigate(id, btn.dataset.sub));
  });
  content.classList.remove('fade');
  void content.offsetWidth;
  content.classList.add('fade');
  updateNavActive();
  window.scrollTo({top:0, behavior:'smooth'});
  requestAnimationFrame(() => { try{ sub.after && sub.after(); }catch(e){ console.warn(e); } });
}

let rz;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    try{
      const p = PAGES[currentPage];
      const sub = p.subs[SUB_STATE[currentPage]];
      sub.after && sub.after();
    }catch(e){}
  }, 180);
});

$('#hamb').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

buildNav();
navigate('overview');
</script>
